<html lang="en" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Access | RareCoin</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
</head>

<body class="auth-page-body">

    <main
        style="padding: 60px 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <div class="auth-logo">
            <a href="index.html">
                <img src="assets/logo.svg" alt="RareCoin Logo">
            </a>
        </div>

        <div class="auth-container">
            <!-- Login Form -->
            <div id="login-form" class="auth-form active">
                <form>
                    <div class="about-stats flex justify-center">
                        <h3>
                            Access My Account
                        </h3>
                    </div>
                    <div class="form-group">
                        <label>Username or Email</label>
                        <input type="text" class="form-control" placeholder="numismatist_01">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" class="form-control" placeholder="••••••••">
                    </div>
                    <div class="flex justify-between align-center auth-options" style="margin-bottom: 25px;">
                        <label style="font-size: 0.8rem; color: var(--text-muted); cursor: pointer;"><input
                                type="checkbox"> Remember me</label>
                        <a href="#" style="font-size: 0.8rem; color: var(--primary-color);">Forgot password?</a>
                    </div>
                    <button type="button" class="btn btn-primary" style="width: 100%; padding: 15px;">Access
                        Vault</button>
                    <div class="social-auth">
                        <p>Or continue with</p>
                        <div class="social-icons">
                            <a href="#" class="social-icon" title="Google">
                                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path
                                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                                        fill="#4285F4" />
                                    <path
                                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-1.02.68-2.33 1.09-3.71 1.09-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                                        fill="#34A853" />
                                    <path
                                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
                                        fill="#FBBC05" />
                                    <path
                                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                                        fill="#EA4335" />
                                </svg>
                            </a>
                            <a href="#" class="social-icon" title="Facebook">
                                <svg viewBox="0 0 24 24">
                                    <path
                                        d="M19.14 7.5H16.06V5.38C16.06 4.6 16.6 4.41 17.08 4.41H19.03V1L16.34 1C13.35 1 12.64 3.23 12.64 5.13V7.5H10V10.91H12.64V21H16.06V10.91H18.82L19.14 7.5Z"
                                        fill="#1877F2" />
                                </svg>
                            </a>
                            <a href="#" class="social-icon" title="Apple">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                                    <path
                                        d="M16.365 1.43c0 1.14-.465 2.19-1.24 2.96-.82.8-2.05 1.42-3.22 1.33-.15-1.1.43-2.2 1.19-2.98.8-.8 2.15-1.4 3.27-1.31zM21 17.02c-.52 1.2-.77 1.73-1.44 2.82-.93 1.5-2.24 3.36-3.86 3.38-1.44.02-1.81-.94-3.77-.93-1.96.01-2.37.95-3.8.94-1.62-.02-2.86-1.7-3.8-3.2-2.62-4.24-2.9-9.2-1.28-11.74 1.15-1.78 2.96-2.82 4.65-2.82 1.73 0 2.82.95 4.26.95 1.4 0 2.25-.96 4.25-.96 1.5 0 3.08.82 4.23 2.24-3.72 2.04-3.11 7.3.56 8.32z" />
                                </svg>
                            </a>
                        </div>
                    </div>
                    <p style="margin-top: 25px; font-size: 0.9rem; color: var(--text-muted); text-align: center;">I'm
                        new to this? <a href="#" class="auth-toggle-btn" data-target="signup-form"
                            style="font-size: 0.9rem;">Create Account</a>
                    </p>
                </form>
            </div>

            <!-- Signup Form -->
            <div id="signup-form" class="auth-form">
                <form>
                    <div class="about-stats flex justify-center">
                        <h3>Create Account</h3>
                    </div>
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" class="form-control" placeholder="Jane Doe">
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" class="form-control" placeholder="jane@example.com">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" class="form-control" placeholder="••••••••">
                    </div>
                    <div class="form-group">
                        <label>Confirm Password</label>
                        <input type="password" class="form-control" placeholder="••••••••">
                    </div>
                    <button type="button" class="btn btn-primary" style="width: 100%; padding: 15px;">Create
                        Account</button>
                    <div class="social-auth">
                        <p>Or join with</p>
                        <div class="social-icons">
                            <a href="#" class="social-icon" title="Google">
                                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path
                                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                                        fill="#4285F4" />
                                    <path
                                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-1.02.68-2.33 1.09-3.71 1.09-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                                        fill="#34A853" />
                                    <path
                                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
                                        fill="#FBBC05" />
                                    <path
                                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                                        fill="#EA4335" />
                                </svg>
                            </a>
                            <a href="#" class="social-icon" title="Facebook">
                                <svg viewBox="0 0 24 24">
                                    <path
                                        d="M19.14 7.5H16.06V5.38C16.06 4.6 16.6 4.41 17.08 4.41H19.03V1L16.34 1C13.35 1 12.64 3.23 12.64 5.13V7.5H10V10.91H12.64V21H16.06V10.91H18.82L19.14 7.5Z"
                                        fill="#1877F2" />
                                </svg>
                            </a>
                            <a href="#" class="social-icon" title="Apple">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                                    <path
                                        d="M16.365 1.43c0 1.14-.465 2.19-1.24 2.96-.82.8-2.05 1.42-3.22 1.33-.15-1.1.43-2.2 1.19-2.98.8-.8 2.15-1.4 3.27-1.31zM21 17.02c-.52 1.2-.77 1.73-1.44 2.82-.93 1.5-2.24 3.36-3.86 3.38-1.44.02-1.81-.94-3.77-.93-1.96.01-2.37.95-3.8.94-1.62-.02-2.86-1.7-3.8-3.2-2.62-4.24-2.9-9.2-1.28-11.74 1.15-1.78 2.96-2.82 4.65-2.82 1.73 0 2.82.95 4.26.95 1.4 0 2.25-.96 4.25-.96 1.5 0 3.08.82 4.23 2.24-3.72 2.04-3.11 7.3.56 8.32z" />
                                </svg>
                            </a>
                        </div>
                    </div>
                    <p style="margin-top: 25px; font-size: 0.9rem; color: var(--text-muted); text-align: center;">
                        Already have an account? <a href="#" class="auth-toggle-btn" data-target="login-form"
                            style="font-size: 0.9rem;">Login</a>
                    </p>
                </form>
                <p style="margin-top: 20px; font-size: 0.8rem; color: var(--text-muted); text-align: center;">By
                    joining, you agree to our <a href="policies.html" style="color: var(--primary-color);">Terms of
                        Service</a>.</p>
            </div>
        </div>
        </div>
    </main>

    <div class="floating-controls">
        <button id="theme-toggle" class="control-btn" title="Toggle Theme">☀️</button>
        <button id="rtl-toggle" class="control-btn" title="Toggle RTL"
            style="font-size: 0.8rem; font-weight: 700;">RTL</button>
    </div>

    <script src="js/main.js"></script>
</body>

</html>
